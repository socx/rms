# deploy.conf — Application deployment configuration
# This file is read by /opt/infra/scripts/deploy.sh on the server.

APP_NAME="rms"
APP_DIR="/opt/apps/rms"
API_PORT=3030
API_ENTRY="src/index.js"
WORKER_ENTRY="dist/worker.js"
WORKER_TYPE="python"                  # "node" or "python"
HEALTH_CHECK_PATH="/api/health"
HEALTH_CHECK_TIMEOUT=30
RELEASES_TO_KEEP=5
RUN_MIGRATIONS="yes"
MIGRATION_DIR="packages/db/prisma"
MIGRATION_DB_VAR="DATABASE_URL"
